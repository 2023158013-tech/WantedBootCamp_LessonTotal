spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/login_jwt
    username: wanted
    password: wanted
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show_sql: true
jwt:
  # JWT의 서명(Signature)을 만들고 검증하는 비밀 키 랜덤한 값을 넣으면 된다.
  secret: "ThisIsAOhgiraffersVeryLongAndSecureSecretKeyForHS256AlgorithmExampleOnlyChangeItInProduction"
  # ↑랜덤한 문자열: 이를 기준으로 하나의 암호화된 키를 만들게 됨(아무거나 32자 이상으로 쓰면됨)
  # 시그니처에 대한 값을 만드는 바탕(header-payload-signature)
  access-token-validity-milliseconds: 3600000 # 1시간(access token의 유효기간 설정: 짧게)
  refresh-token-validity-milliseconds: 864000000 # 10일(refresh token의 유효기간 설정: 길게)